
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jeden mniej | Fotografie</title>
  <style>
    :root {
      --bg: #161616;
      --fg: #f0eee9;
      --muted: #929292;
      --gap: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1600px;
      margin: auto;
      padding: 55px 40px 65px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      font-size: clamp(30px, 4vw, 54px);
      font-weight: 400;
      letter-spacing: -0.055em;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 10px;
    }

    main {
      max-width: 1600px;
      margin: auto;
      padding: 0 40px;
    }

    .gallery {
      columns: 3;
      column-gap: var(--gap);
    }

    .photo {
      display: block;
      width: 100%;
      margin: 0 0 var(--gap);
      padding: 0;
      border: 0;
      background: #222;
      cursor: zoom-in;
      break-inside: avoid;
      overflow: hidden;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .4s ease, opacity .4s ease;
    }

    .photo:hover img {
      transform: scale(1.015);
      opacity: .85;
    }

    .empty {
      color: var(--muted);
      padding: 80px 0;
      text-align: center;
      font-size: 14px;
    }

    footer {
      max-width: 1600px;
      margin: 100px auto 0;
      padding: 24px 40px 45px;
      border-top: 1px solid #303030;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(8,8,8,.97);
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
    }

    .control {
      position: absolute;
      border: 0;
      background: transparent;
      color: white;
      font-size: 28px;
      padding: 15px;
      cursor: pointer;
    }

    .close { top: 15px; right: 25px; }
    .prev { left: 20px; }
    .next { right: 20px; }

    @media (max-width: 850px) {
      .gallery { columns: 2; }
      header { padding: 35px 20px 45px; }
      main { padding: 0 20px; }
      footer { padding: 25px 20px; }
    }

    @media (max-width: 500px) {
      .gallery { columns: 1; }
      .subtitle { font-size: 9px; }
      .prev { left: 0; }
      .next { right: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>Jeden mniej</h1>
  <span class="subtitle">Fotografie</span>
</header>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<footer>
  <span>Jeden mniej</span>
  <span>© 2026</span>
</footer>

<div class="lightbox" id="lightbox" role="dialog"
     aria-label="Podgląd fotografii" aria-modal="true">
  <button class="control close" aria-label="Zamknij">×</button>
  <button class="control prev" aria-label="Poprzednie zdjęcie">‹</button>
  <img id="largeImage" alt="">
  <button class="control next" aria-label="Następne zdjęcie">›</button>
</div>

<script>
  // Lista fotografii. Dodamy ją w następnym kroku.
  
const photos = [
  { src: "images/001.jpg", alt: "Fotografia 001" },
  { src: "images/009.jpg", alt: "Fotografia 009" },
  { src: "images/0388.jpg", alt: "Fotografia 0388" },
  { src: "images/058.jpg", alt: "Fotografia 058" },
  { src: "images/0603.jpg", alt: "Fotografia 0603" }
];


  const gallery = document.getElementById("gallery");
  const lightbox = document.getElementById("lightbox");
  const largeImage = document.getElementById("largeImage");
  let current = 0;

  if (photos.length === 0) {
    gallery.innerHTML =
      '<p class="empty">Miejsce na fotografie.</p>';
  }

  photos.forEach((photo, index) => {
    const button = document.createElement("button");
    button.className = "photo";
    button.setAttribute(
      "aria-label", "Powiększ: " + photo.alt
    );

    const img = document.createElement("img");
    img.src = photo.src;
    img.alt = photo.alt;
    img.loading = "lazy";

    button.appendChild(img);
    button.addEventListener("click", () => openPhoto(index));
    gallery.appendChild(button);
  });

  function openPhoto(index) {
    if (!photos.length) return;
    current = (index + photos.length) % photos.length;
    largeImage.src = photos[current].src;
    largeImage.alt = photos[current].alt;
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closePhoto() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }

  document.querySelector(".close")
    .addEventListener("click", closePhoto);
  document.querySelector(".prev")
    .addEventListener("click", () => openPhoto(current - 1));
  document.querySelector(".next")
    .addEventListener("click", () => openPhoto(current + 1));

  lightbox.addEventListener("click", event => {
    if (event.target === lightbox) closePhoto();
  });

  document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("active")) return;
    if (event.key === "Escape") closePhoto();
    if (event.key === "ArrowLeft") openPhoto(current - 1);
    if (event.key === "ArrowRight") openPhoto(current + 1);
  });
</script>

</body>
</html>
